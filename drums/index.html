/* Song Box Drums: drum a rhythm into the dot, the box hears pattern and tempo and jams back with percussion; music is optional.
   Built from Song Box Simple: a spinning circular roll with one record button in the middle,
   voice sliders on the left, band sliders on the right, two volumes below. lil.audio look. */
:root{--bg:hsl(300,38%,30%);--ink:255 255 255;--on-ink:#1a1a2e;--rec:#ff2d2d;
  --f:"Comic Sans MS","ComicSans","Comic Neue",cursive;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:rgb(var(--ink));transition:background-color 1.5s ease,color 1.5s ease}
body{font-family:var(--f);font-weight:bold;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font-family:inherit;font-weight:bold;color:inherit}
.stage{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:14px;max-width:980px;margin:0 auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px))}
.logo{margin:0;font-size:1.5rem;line-height:1;text-transform:lowercase;opacity:.55}
.deck{flex:1;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(8px,3vw,40px)}
.side{display:flex;gap:clamp(6px,2.4vw,30px);justify-content:center}
.v{display:flex;flex-direction:column;align-items:center;gap:6px;width:46px}
.v .lbl{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;opacity:.55;white-space:nowrap}

.v input{writing-mode:vertical-lr;direction:rtl;width:32px;height:clamp(150px,34vh,300px)}
.ring{position:relative;width:100%;max-width:560px;aspect-ratio:1;justify-self:center}
#viz{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#viz.grabbed{cursor:grabbing}
#main{position:absolute;left:50%;top:50%;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  border:0;background:var(--rec);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0;
  box-shadow:0 0 34px rgba(255,45,45,.45);-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

.link:hover{opacity:1}
.hint{margin:0;font-size:.8rem;opacity:.5;text-align:center;max-width:52ch;min-height:2.3em}

.h{display:flex;flex-direction:column;gap:6px}

.blank #beatBtn{visibility:hidden}

  .ring{max-width:none;width:min(100%,60dvh);width:min(100%,60vh)}

  @supports (height:1dvh){.ring{width:min(100%,60dvh)}}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(()=>{
const $=s=>document.querySelector(s);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const mtof=m=>440*Math.pow(2,(m-69+TUNE/100)/12);
function mkRng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function L4(a,x){x=clamp(x)*(a.length-1);const i=Math.min(a.length-2,Math.floor(x));let u=x-i;u=u*u*(3-2*u);return a[i]+(a[i+1]-a[i])*u}
function seg(x){const f=clamp(x)*3;const i=Math.min(2,Math.floor(f));let u=f-i;u=u*u*(3-2*u);return[i,u]}

/* ---------- music model ---------- */
// key, register and tuning follow the singer: root, lead register and the band's tuning offset (cents) are set from the call
const STEPS=32;let ROOT_PC=4,LEAD_BASE=64,BASS_BASE=40,PAD_BASE=52,TUNE=0;
const NOTE=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const SCALES=[
  {n:'major',s:[0,2,4,5,7,9,11]},{n:'lydian',s:[0,2,4,6,7,9,11]},{n:'whole tone',s:[0,2,4,6,8,10,12]},
  {n:'dorian',s:[0,2,3,5,7,9,10]},{n:'minor',s:[0,2,3,5,7,8,10]},{n:'phrygian',s:[0,1,3,5,7,8,10]}];
const into=(pc,lo)=>lo+(((pc-lo)%12)+12)%12;
function setKey(root,lb){ROOT_PC=root;LEAD_BASE=lb;BASS_BASE=into(root,33);PAD_BASE=into(root,45)}
// form: the sung call, the box's answer, the call again, then a second answer that lands home. BARS = bars per phrase, measured from the call.
let BARS=2,SEC_STEPS=32,SONG_STEPS=128;
const SONG=[{k:'call',m:'call',n:'Call',e:-.06},{k:'answer',m:'ansA',n:'Answer',e:0},{k:'call',m:'call',n:'Call',e:-.03},{k:'answer',m:'ansB',n:'Answer',e:.08}];
function setForm(bars){BARS=bars;SEC_STEPS=16*BARS;SONG_STEPS=SONG.length*SEC_STEPS}
const chordSteps=()=>BARS>=2?16:8;
function chordAt(sec,ls){const pr=S.prog[SONG[sec].m];return pr[Math.floor(ls/chordSteps())%pr.length]}
const S={tempo:.3,mood:0,party:.4,leadTex:.67,leadVol:.8,beatTex:.67,beatVol:.72,robot:.72,critter:.5,vEcho:.3,voiceVol:.85,energy:.5,mix:.5,style:.33,
  prog:null,melody:null,beat:null};
const scaleObj=()=>SCALES[Math.round(S.mood*(SCALES.length-1))];
const scaleName=()=>NOTE[ROOT_PC]+' '+scaleObj().n;
function d2m(base,d){const sc=scaleObj().s;const o=Math.floor(d/7),i=((d%7)+7)%7;return base+sc[i]+12*o}
function m2d(m){let best=0,bd=99;for(let d=-10;d<=20;d++){const x=Math.abs(d2m(LEAD_BASE,d)-m);if(x<bd){bd=x;best=d}}return best}
const bpmRaw=()=>S.bpmOv>0?S.bpmOv:150*Math.pow(32/150,Math.pow(S.tempo,1.25)),bpm=()=>Math.round(bpmRaw());
const tempoFor=b=>clamp(Math.pow(Math.log(b/150)/Math.log(32/150),1/1.25));
const cm=()=>clamp((S.party-.45)/.55), amb=()=>clamp((S.tempo-.6)/.4);
const stepDur=()=>60/bpmRaw()/4;
const chordTones=c=>[c%7,(c+2)%7,(c+4)%7];
function nearestCT(d,c,lo=0,hi=9){let best=clamp(d,lo,hi),bd=99;for(let k=-2;k<=2;k++)for(const t of[0,2,4]){const x=c+t+7*k,dd=Math.abs(x-d);if(x>=lo&&x<=hi&&dd<bd){bd=dd;best=x}}return best}
const impAt=s=>{const o=s%16;return o===0?1:o===8?.9:o%4===0?.72:o%2===0?.5:.32};

// chord templates per phrase length: the call gets a progression that fits what was sung,
// the first answer ends on the V chord (open), the second on I (closed)
const PT={2:{call:[[0,4],[0,3],[0,5],[0,0],[0,1],[5,4],[3,4],[3,0]],open:[[3,4],[5,4],[1,4],[0,4]],closed:[[4,0],[3,0],[1,0],[5,0]]},
  4:{call:[[0,5,3,4],[0,3,4,0],[0,4,5,3],[0,3,0,4],[0,5,1,4],[0,0,3,4],[0,4,3,4],[5,3,0,4],[3,4,0,0]],open:[[0,3,1,4],[5,3,0,4],[3,0,1,4],[0,5,3,4],[1,3,0,4]],closed:[[3,4,0,0],[5,3,4,0],[1,4,0,0],[3,1,4,0],[0,3,4,0]]}};
PT[3]={call:[[0,3,4],[0,5,4],[0,4,0],[0,0,4],[0,3,0],[5,3,4]],open:[[0,3,4],[5,1,4],[3,0,4],[0,1,4]],closed:[[3,4,0],[1,4,0],[5,4,0],[0,4,0]]};
const tpl=()=>PT[clamp(BARS,2,4)];
const VR=[[0,2,4,6,8,10,12],[0,3,6,8,10,12],[0,2,4,7,8,12],[0,4,6,8,11,12,14],[0,2,3,4,8,10,12],[0,6,8,10,12],[0,2,4,8,12,14]];
function progScore(prog,mel){const CH=chordSteps();let sc=0;for(const n of mel){const w=n.imp*(1+Math.min(4,n.len||1)*.25);
  if(chordTones(prog[Math.floor(n.s/CH)%prog.length]).includes(((n.d%7)+7)%7))sc+=w;else if(n.imp>=.7)sc-=w*.3}return sc}
function bestProg(r,list,mel,avoid){let best=null,bs=-1e9;for(const p of list){if(avoid&&p.join()===avoid.join())continue;const sc=progScore(p,mel)+r()*.8+(p[0]===0?.3:0);if(sc>bs){bs=sc;best=p}}return best||list[0]}

// the answer: echoes the call's rhythm with small changes, sequences or mirrors the call's first half
// (up when happy, down when sad), then walks to its landing note: the 5th for the open answer, home for the closed one
function genAnswer(r,call,prog,closed){
  const N=SEC_STEPS,CH=chordSteps(),lo=-3,hi=10,ch=s=>prog[Math.floor(s/CH)%prog.length];
  let ons=call.map(n=>({s:n.s,len:n.len||2}));
  if(ons.length<3){ons=[];for(let b=0;b<BARS;b++)for(const o of pick(r,VR))if(o<16)ons.push({s:b*16+o,len:2})}
  let rh=[];ons.forEach((o,i)=>{if(i>0&&i<ons.length-1&&o.s%4!==0&&r()<.2)return;rh.push({s:o.s,len:o.len});
    const nx=i+1<ons.length?ons[i+1].s:N;if(nx-o.s>=6&&o.len>=4&&r()<.3)rh.push({s:o.s+(((nx-o.s)>>1)&~1),len:2})});
  rh.sort((a,b)=>a.s-b.s);rh=rh.filter((o,i)=>i===0||o.s!==rh[i-1].s);
  const lst=rh[rh.length-1];if(lst.s%4){lst.s-=lst.s%4;if(rh.length>1&&rh[rh.length-2].s>=lst.s)rh.pop()}
  if(rh[rh.length-1].s<N-8)rh.push({s:N-8,len:8});
  rh.forEach((o,i)=>{const nx=i+1<rh.length?rh[i+1].s:N;o.len=i===rh.length-1?nx-o.s:Math.max(1,Math.min(o.len,nx-o.s))});
  const m=S.mood,shift=pick(r,m<.35?[2,2,4,1,0,3]:m>.65?[-2,-1,-3,0,-2,1]:[0,1,-1,2,-2]),inv=r()<.3;
  const c0=call.length?call[0].d:2,mean=call.length?Math.round(call.reduce((a,n)=>a+n.d,0)/call.length):2,half=N/2;
  const near=(opts,x)=>opts.reduce((b,o)=>Math.abs(o-x)<Math.abs(b-x)?o:b);
  const target=closed?near([0,7],mean+(m<.5?1:-1)):near([-3,1,4,6,8],mean+shift);
  const notes=[];let d=c0;
  rh.forEach((o,i)=>{const left=rh.length-1-i,c=ch(o.s),cn=call.filter(n=>n.s<=o.s).pop();let nd;
    if(left===0)nd=target;
    else if(o.s<half&&cn){nd=inv?c0-(cn.d-c0)+Math.round(shift/2):cn.d+shift;if(r()<.15)nd+=pick(r,[1,-1])}
    else{const gap=target-d,stp=Math.sign(gap)*Math.min(Math.abs(gap),pick(r,[1,1,2,1,3]));nd=d+(left>2&&r()<.3?(-stp||pick(r,[1,-1])):stp);
      if(left<=2&&Math.abs(target-nd)>3)nd=target+Math.sign(nd-target)*2}
    if(o.s%4===0&&left>0)nd=nearestCT(nd,c,lo,hi);
    nd=clamp(nd,lo,hi);d=nd;notes.push({s:o.s,len:o.len,d:nd,imp:left===0||i===0?1:impAt(o.s)})});
  // passing notes that only appear when the energy is up
  const extra=[];notes.forEach((n,i)=>{const nx=i+1<notes.length?notes[i+1].s:N;if(i<notes.length-1&&nx-n.s>=3&&r()<.35)extra.push({s:n.s+2,len:1,d:clamp(n.d+pick(r,[1,-1,2,-2]),lo,hi),imp:.12+r()*.12})});
  return notes.concat(extra).sort((a,b)=>a.s-b.s);
}

function arr(){return new Array(STEPS).fill(0)}
function put(a,steps,v,r,j=.08){for(const b of[0,16])for(const s of steps)a[b+s]=clamp(v+(r()-.5)*2*j)}
function genBeat(r){
  const D={kick:[],snare:[],hat:[],perc:[]},bass=[],comp=[];
  // 0 synthetic reggaeton
  {const k=arr(),s=arr(),h=arr(),p=arr();put(k,[0,4,8,12],1,r);put(s,[3,11],.92,r);put(s,[6,14],.8,r);

    const now=performance.now();for(const h of tapRec.hits){const a=-Math.PI/2+((h.at-tapRec.t0)/4000%1)*TAU,rr=[R0*.9,(R0+R1)/2,(R1+R)/2][h.cls],age=clamp((now-h.at)/600);cx.fillStyle=COL.voice;cx.globalAlpha=.5+.5*(1-age);cx.beginPath();cx.arc(C+Math.cos(a)*rr,C+Math.sin(a)*rr,5+8*(1-age),0,TAU);cx.fill()}cx.globalAlpha=1;requestAnimationFrame(draw);return}

  requestAnimationFrame(draw);
}

/* ---------- vinyl: hold the ring to stop it, hold and move to scratch ---------- */
// the master output is captured into one revolution of audio, indexed by song position; while the ring is held the
// band's clock stops and a scratch player reads that audio at whatever speed and direction the hand moves it
let vDuck=null,scratchG=null,VB=null,VL=0,grab=null,vpos=0,park=0,vinylSeek=()=>{},vinylBrakeOff=()=>{},braking=()=>false;
function songPos(){return curStep+(ac?clamp((ac.currentTime-curT)/stepDur(),0,1):0)}
const wrapS=p=>((p%SONG_STEPS)+SONG_STEPS)%SONG_STEPS;
function vinylInit(lim){
  vDuck=ac.createGain();lim.disconnect();lim.connect(vDuck);vDuck.connect(ac.destination);
  const cap=ac.createScriptProcessor(MOBILE?4096:1024,2,2),z=ac.createGain();z.gain.value=0;lim.connect(cap);cap.connect(z);z.connect(ac.destination);
  cap.onaudioprocess=e=>{if(!playing||grab||curStep<0)return;const L=Math.round(SONG_STEPS*stepDur()*ac.sampleRate);
    if(!VB||VL!==L){VB=[new Float32Array(L),new Float32Array(L)];VL=L}
    const a=e.inputBuffer.getChannelData(0),b=e.inputBuffer.numberOfChannels>1?e.inputBuffer.getChannelData(1):a;
    let j=Math.floor(wrapS(songPos())/SONG_STEPS*L)%L;for(let i=0;i<a.length;i++){VB[0][j]=a[i];VB[1][j]=b[i];if(++j>=L)j=0}};
  const sp=ac.createScriptProcessor(MOBILE?2048:1024,0,2);scratchG=ac.createGain();scratchG.gain.value=0;sp.connect(scratchG);scratchG.connect(ac.destination);
  let rp=0,rate=0,brake=false;const dec=1/(.42*ac.sampleRate); // vinyl stop: full speed to still in about 0.4 s
  sp.onaudioprocess=e=>{const o0=e.outputBuffer.getChannelData(0),o1=e.outputBuffer.getChannelData(1),n=o0.length;
    if((!grab&&!brake)||!VB){o0.fill(0);o1.fill(0);rate=0;return}
    if(brake){const L=VL;for(let i=0;i<n;i++){rate=Math.max(0,rate-dec*(.6+rate*.8));rp+=rate;if(rp>=L)rp-=L;
        const k=Math.floor(rp),f=rp-k,k2=(k+1)%L;o0[i]=VB[0][k]*(1-f)+VB[0][k2]*f;o1[i]=VB[1][k]*(1-f)+VB[1][k2]*f}
      vpos=rp/L*SONG_STEPS;if(!grab)park=vpos;if(rate<=0)brake=false;return}
    const L=VL;let d=wrapS(vpos)/SONG_STEPS*L-rp;if(d>L/2)d-=L;if(d<-L/2)d+=L;const want=Math.max(-6,Math.min(6,d/n));
    for(let i=0;i<n;i++){rate+=(want-rate)*.006;rp+=rate;if(rp>=L)rp-=L;if(rp<0)rp+=L;
      const k=Math.floor(rp),f=rp-k,k2=(k+1)%L;o0[i]=VB[0][k]*(1-f)+VB[0][k2]*f;o1[i]=VB[1][k]*(1-f)+VB[1][k2]*f}};
  vinylSeek=(p,brk)=>{rp=VL?wrapS(p)/SONG_STEPS*VL:0;rate=brk?1:0;brake=!!brk};vinylBrakeOff=()=>{brake=false};braking=()=>brake}
{const angOf=e=>{const r=cv.getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)};
  cv.addEventListener('pointerdown',e=>{if(tapRec){const r=cv.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,f=Math.hypot(dx,dy)/(Math.min(r.width,r.height)/2);tapHit(f<.3?0:f<.68?1:2);return}if(!voice||rec)return;ensureAudio();if(!vDuck)return;
    const was=playing;vpos=was&&curStep>=0?songPos():park;grab={was,a:angOf(e),t0:performance.now(),moved:0};vinylSeek(vpos,was);
    if(was){clearInterval(timer);leadRelease();stopRendered(ac.currentTime);vq.length=0}
    const n=ac.currentTime;vDuck.gain.cancelScheduledValues(n);vDuck.gain.setTargetAtTime(0,n,.01);scratchG.gain.cancelScheduledValues(n);scratchG.gain.setTargetAtTime(1,n,.004);
    cv.classList.add('grabbed');try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(!grab)return;const a=angOf(e);let d=a-grab.a;if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;grab.a=a;grab.moved+=Math.abs(d);if(grab.moved>.04)vinylBrakeOff();if(braking())return;vpos+=d/(Math.PI*2)*SONG_STEPS});

    scratchG.gain.setTargetAtTime(0,n,.01);vDuck.gain.cancelScheduledValues(n);vDuck.gain.setTargetAtTime(1,n+.03,.01);

<script>
/* lil skin colour: like lil.audio the page is one soft colour whose hue drifts slowly.
   Calm energy is dark with white text, party is light with dark text. Visual only, reads the energy slider. */
(function(){
  const root=document.documentElement;
  const el=document.getElementById('energy')||document.getElementById('party');
  const flip=!!el&&el.id==='party'; // older pages: party slider runs party (0) to calm (1)
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lerp=(a,b,t)=>a+(b-a)*t, ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
  const t0=Date.now();
  function paint(){
    let y=el?+el.value:.5; if(flip)y=1-y; if(!isFinite(y))y=.5;
    const hue=(300+(still?0:(Date.now()-t0)/40000*360))%360;
    root.style.setProperty('--bg',`hsl(${hue.toFixed(1)},${lerp(38,48,y).toFixed(1)}%,${(y<.5?lerp(20,32,y/.5):lerp(64,78,(y-.5)/.5)).toFixed(1)}%)`);
    const k=ss(.48,.52,y), c=[255,255,255].map((v,i)=>Math.round(lerp(v,[26,26,46][i],k)));
    root.style.setProperty('--ink',c.join(' '));
    root.style.setProperty('--on-ink',k>.5?'#ffffff':'#1a1a2e');
  }
  paint(); setInterval(paint,250); if(el)el.addEventListener('input',paint);
})();
</script>

<style>
/* Sonne (the drifting looper): sing a loop, it repeats in four stereo copies of slightly different lengths that slowly drift apart.
   The box only adds a soft harmony layer underneath and tunes and colours the voice. lil.audio look. */
:root{--bg:hsl(250,40%,22%);--ink:255 255 255;--rec:#ff2d2d;
  --f:"Comic Sans MS","ComicSans","Comic Neue",cursive;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:rgb(var(--ink));transition:background-color 1.5s ease}
body{font-family:var(--f);font-weight:bold;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font-family:inherit;font-weight:bold;color:inherit}
.stage{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:14px;max-width:980px;margin:0 auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px))}
.logo{margin:0;font-size:1.5rem;line-height:1;text-transform:lowercase;opacity:.55;text-align:center}
.stage .logo{position:relative}
.near{position:absolute;left:100%;top:-.1em;margin-left:.35em;font-size:.4em;letter-spacing:.25em;white-space:nowrap;transition:opacity .6s}
.near:empty{opacity:0}
.link.solo{display:inline-flex;align-items:center;gap:7px;font-size:.75rem;opacity:.45;padding:2px 6px;margin-top:-4px;text-decoration:none}
.solo[hidden]{display:none}
.solo i{position:relative;width:22px;height:12px;border-radius:6px;border:1.5px solid currentColor;box-sizing:border-box}
.solo i::after{content:'';position:absolute;top:1.5px;left:2px;width:6px;height:6px;border-radius:50%;background:currentColor;transition:left .2s}
.solo.on{opacity:.85}.solo.on i::after{left:11px}
.deck{flex:1;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(8px,3vw,40px)}
.side{display:flex;gap:clamp(6px,2.4vw,30px);justify-content:center}
.v{display:flex;flex-direction:column;align-items:center;gap:6px;width:46px}
.v .lbl{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;opacity:.55;white-space:nowrap}
.v .e{font-size:.68rem;opacity:.45;text-transform:lowercase;white-space:nowrap;line-height:1.2;text-align:center}
.v input{writing-mode:vertical-lr;direction:rtl;width:32px;height:clamp(150px,38vh,320px)}
.ring{position:relative;width:100%;max-width:580px;aspect-ratio:1;justify-self:center}
#viz{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#main{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  border:0;background:var(--rec);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0;
  box-shadow:0 0 34px rgba(255,45,45,.45);-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#main svg{width:38%;height:38%}
#main:active{transform:translate(-50%,-50%) scale(.94)}
#main.recording{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,45,45,.6)}50%{box-shadow:0 0 0 22px rgba(255,45,45,0)}}
.under{display:flex;flex-direction:column;align-items:center;gap:6px}
.small{display:flex;gap:26px}
.link{background:none;border:0;padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:4px;font-size:.95rem;opacity:.75}
.link:hover{opacity:1}
.spd{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;width:min(340px,100%)}
.spd .lbl{grid-column:1/-1;text-align:center;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;opacity:.55}
.spd .e{font-size:.68rem;opacity:.45}
.spd input{width:100%;height:32px;min-width:0}
.spd input::-webkit-slider-runnable-track{height:12px}.spd input::-webkit-slider-thumb{margin-top:-10px}
.hint{margin:0;font-size:.8rem;opacity:.5;text-align:center;max-width:52ch;min-height:2.3em}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{border-radius:6px;background:rgba(127,127,127,.35)}
.v input::-webkit-slider-runnable-track{width:12px}
input[type=range]::-moz-range-track{border-radius:6px;background:rgba(127,127,127,.35);height:12px;width:12px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:currentColor;border:0}
.v input::-webkit-slider-thumb{margin-left:-10px}
input[type=range]::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:currentColor;border:0}
button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:4px}
[hidden]{display:none!important}
.blank .small{visibility:hidden}
/* phones (Ville, 5 Nov 2026): every slider lies flat at full width, stacked, voice pair above the ring and style pair below */
@media (max-width:640px){.stage{gap:8px;padding-top:10px;padding-bottom:14px}
  .deck{grid-template-columns:1fr;gap:8px;align-content:center}
  .side{display:grid;grid-template-columns:1fr;gap:6px;width:100%}
  .v{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:0 10px}
  .v .lbl{grid-column:2;grid-row:1;text-align:center;font-size:.6rem;letter-spacing:.12em}
  .v .e{font-size:.62rem;grid-row:1;width:auto;display:block}
  .v .lbl+.e{grid-column:3;text-align:right}.v .e:last-child{grid-column:1;text-align:left}
  .v input{grid-column:1/-1;grid-row:2;writing-mode:horizontal-tb;direction:ltr;width:100%;height:32px;min-width:0}
  .v input::-webkit-slider-runnable-track{width:auto;height:12px}.v input::-webkit-slider-thumb{margin-left:0;margin-top:-10px}
  .spd{width:100%}
  .ring{max-width:none;width:min(100%,60dvh);width:min(100%,60vh)}
  @supports (height:1dvh){.ring{width:min(100%,60dvh)}}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<style>
@font-face{font-family:ComicSans;src:url("/fonts/comic-sans-bold.woff2") format("woff2");font-weight:bold;font-display:swap}
#lilgate{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#1a1a2e;font-family:ComicSans,"Comic Sans MS",cursive;font-weight:bold}
#lilgate .logo{font-size:60px;color:#fff}
#lilgate input{font-family:inherit;font-weight:bold;font-size:20px;padding:12px 24px;border:3px solid rgba(255,255,255,.3);border-radius:50px;text-align:center;outline:none;background:transparent;color:#fff;letter-spacing:.1em;max-width:80vw}
#lilgate input::placeholder{color:rgba(255,255,255,.2)}
#lilgate .hint{font-size:14px;opacity:.2;color:#fff}
#lilgate.wrong input{border-color:#ff3b30;animation:lilshake .4s ease}
@keyframes lilshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
html.lil-ok #lilgate{display:none}
</style>

<body>
<div id="lilgate"><div class="logo">lil</div><input id="lilpw" type="password" placeholder="•••••••" autocomplete="current-password" autofocus><div class="hint">sonne</div></div>
<script>(function(){var PASS='bambient',g=document.getElementById('lilgate'),i=document.getElementById('lilpw');
function tryPw(){if(i.value===PASS){document.documentElement.classList.add('lil-ok');try{sessionStorage.setItem('lil-ok','1')}catch(e){}i.blur()}
else if(i.value){g.classList.add('wrong');i.value='';setTimeout(function(){g.classList.remove('wrong')},400)}}
i.addEventListener('keydown',function(e){if(e.key==='Enter')tryPw()});i.addEventListener('change',tryPw);})();</script>


<div class="stage blank">
  <h1 class="logo">sonne<span class="near" id="near" aria-hidden="true"></span></h1>
  <div class="deck">
    <div class="side">
      <div class="v"><span class="lbl">drift</span><span class="e">apart</span><input type="range" id="drift" min="0" max="1" step="0.001" value="0.45" aria-label="Drift: together (bottom) to drifting apart (top)"><span class="e">together</span></div>
      <div class="v"><span class="lbl">memory</span><span class="e">fast</span><input type="range" id="memory" min="0" max="1" step="0.001" value="0.2" aria-label="Memory: loops last forever (left or bottom) to loops fade fast (right or top)"><span class="e">forever</span></div>
    </div>
    <div class="ring">
      <canvas id="viz" aria-label="The loops go round in rings, one ring per drifting copy. Tap to play or stop."></canvas>
      <button id="main" aria-label="Hold to sing"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="mainIcon" d="" fill="currentColor"/></svg></button>
    </div>
    <div class="side">
      <div class="v"><span class="lbl">tuning</span><span class="e">robot</span><input type="range" id="tune" min="0" max="1" step="0.001" value="0.5" aria-label="Tuning: human voice (left or bottom) to robot-clean (right or top)"><span class="e">human</span></div>
      <div class="v"><span class="lbl">space</span><span class="e">far</span><input type="range" id="space" min="0" max="1" step="0.001" value="0.45" aria-label="Space: close and dry (bottom) to far away and washed (top)"><span class="e">close</span></div>
    </div>
  </div>
  <div class="under">
    <div class="spd"><span class="lbl">speed</span><span class="e">slow</span><input type="range" id="speed" min="-12" max="12" step="1" value="0" aria-label="Speed: slow and low (left) to fast and high (right), like a tape"><span class="e">fast</span></div>
    <div class="small"><button class="link" id="harmBtn">new harmony</button><button class="link" id="clearBtn">clear</button></div>
    <p class="hint" id="hint" aria-live="polite">Hold the red dot and sing. Let go and your tune loops in four copies that slowly drift apart. Sing again while it plays to add a layer.</p>
    <button class="link solo" id="soloBtn" hidden aria-pressed="false" aria-label="Solo: keep this sonne's own key">solo<i></i></button>
  </div>
  <input type="file" id="voiceFile" accept="audio/*" hidden>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const mtof=m=>440*Math.pow(2,(m-69)/12);
const median=a=>{const b=[...a].sort((x,y)=>x-y);return b.length?b[b.length>>1]:0};
const pcOf=m=>((Math.round(m)%12)+12)%12;
const setHint=t=>{$('#hint').textContent=t};
const SL=k=>+$('#'+k).value;

/* ---------- listening (pitch tracker, notes, key: from Song Box) ---------- */
// scale a take by its loud part, not by one stray bump (a finger on the phone), and round off the few peaks above,
// so quiet or far-away singing still reaches a full level for listening and playback
function loudNorm(x,pk){const n=x.length,st=Math.max(1,Math.floor(n/20000)),a=[];for(let i=0;i<n;i+=st)a.push(Math.abs(x[i]));a.sort((p,q)=>p-q);
  const p=a[Math.floor(a.length*.998)]||pk,g=.9/Math.max(p,pk*.15);
  for(let i=0;i<n;i++){const y=x[i]*g,m=Math.abs(y);x[i]=m<=.8?y:Math.sign(y)*(.8+.2*Math.tanh((m-.8)/.2))}}
function analyzeVoice(buf,maxSec=16){
  const sr=buf.sampleRate,n=Math.min(buf.length,Math.floor(sr*maxSec)),mono=new Float32Array(n);
  for(let c=0;c<buf.numberOfChannels;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)mono[i]+=d[i]/buf.numberOfChannels}
  let pk=0;for(let i=0;i<n;i++)pk=Math.max(pk,Math.abs(mono[i]));const rawPk=pk;if(pk>0)loudNorm(mono,pk);
  let st=0;while(st<n&&Math.abs(mono[st])<.03)st++;st=Math.max(0,st-Math.floor(sr*.01));
  const trimmed=mono.slice(st);const out=new AudioBuffer({length:Math.max(1,trimmed.length),sampleRate:sr,numberOfChannels:1});out.copyToChannel(trimmed,0);
  const ds=Math.max(1,Math.round(sr/11025)),dsr=sr/ds,x=new Float32Array(Math.floor(trimmed.length/ds));
  for(let i=0;i<x.length;i++){let a=0;for(let j=0;j<ds;j++)a+=trimmed[i*ds+j];x[i]=a/ds}
  const hop=.01,frames=Math.floor(trimmed.length/sr/hop),W=Math.round(dsr*.03),minL=Math.floor(dsr/1000),maxL=Math.ceil(dsr/65);
  const pitch=new Float32Array(frames),rms=new Float32Array(frames),d=new Float32Array(maxL+2);
  for(let f=0;f<frames;f++){const s0=Math.max(0,Math.round(f*hop*dsr-W/2));
    let e=0,cnt=0;for(let i=0;i<W&&s0+i<x.length;i++){e+=x[s0+i]*x[s0+i];cnt++}rms[f]=cnt?Math.sqrt(e/cnt):0;
    if(s0+W+maxL+1>=x.length||rms[f]<.02)continue;
    let run=0;d[0]=1;for(let tau=1;tau<=maxL+1;tau++){let a=0;for(let i=0;i<W;i++){const q=x[s0+i]-x[s0+i+tau];a+=q*q}run+=a;d[tau]=run>0?a*tau/run:1}
    let gm=1;for(let k=Math.max(2,minL);k<=maxL;k++)gm=Math.min(gm,d[k]);const th=Math.max(.2,gm*1.25+.04);
    let tau=-1;if(gm<.6)for(let k=Math.max(2,minL);k<=maxL;k++){if(d[k]<th){while(k+1<=maxL&&d[k+1]<d[k])k++;tau=k;break}}
    if(tau<0)continue;const a=d[tau-1],b=d[tau],c=d[tau+1],den=a-2*b+c,ti=den?tau+.5*(a-c)/den:tau;pitch[f]=dsr/ti}
  return{buf:out,pitch,rms,lead:st/sr,rawPk};
}
function segmentNotes(v){
  const F=v.pitch.length,hop=.01;let mx=0;for(let f=0;f<F;f++)mx=Math.max(mx,v.rms[f]);
  const thr=Math.max(.015,mx*.1),mid=new Float32Array(F);
  for(let f=0;f<F;f++)mid[f]=v.pitch[f]>70&&v.pitch[f]<1400&&v.rms[f]>thr?69+12*Math.log2(v.pitch[f]/440):0;
  for(let f=1;f<F;f++)if(mid[f]&&mid[f-1]&&Math.abs(mid[f]-mid[f-1])>9)mid[f]-=12*Math.round((mid[f]-mid[f-1])/12);
  const notes=[];let cur=null,dev=0,gap=0;
  const close=end=>{if(!cur)return;const ms=cur.ms.slice(Math.floor(cur.ms.length*.25));const dur=(end-cur.f0)*hop;if(dur>=.07&&ms.length)notes.push({t:cur.f0*hop,dur,m:median(ms),pk:cur.pk});cur=null};
  for(let f=0;f<F;f++){
    if(!mid[f]){gap++;if(gap>=3&&cur)close(f-gap+1);continue}
    gap=0;
    if(cur&&cur.ms.length){const ref=median(cur.ms.slice(-10));
      if(Math.abs(mid[f]-ref)>.75){if(++dev>=4){const f0=f-3;cur.ms.length=Math.max(1,cur.ms.length-3);close(f0);cur={f0,ms:[mid[f-3],mid[f-2],mid[f-1]].filter(Boolean),pk:v.rms[f]};dev=0}}
      else dev=0;
      if(cur&&f-cur.f0>10){let lo=1,fm=f-6;for(let j=f-6;j<f;j++)if(v.rms[j]<lo){lo=v.rms[j];fm=j}
        if(lo<cur.pk*.45&&v.rms[f]>lo*1.8){close(fm);cur={f0:fm,ms:[],pk:0}}}}
    if(!cur)cur={f0:f,ms:[],pk:0};
    cur.ms.push(mid[f]);cur.pk=Math.max(cur.pk,v.rms[f]);
  }
  close(F);
  if(notes.length>2){const md=median(notes.map(n=>n.m));for(const n of notes){while(n.m-md>9)n.m-=12;while(md-n.m>9)n.m+=12}}
  const out=[];for(const n of notes){const p=out[out.length-1];if(p&&n.dur<.09&&n.t-(p.t+p.dur)<.04)p.dur=n.t+n.dur-p.t;else out.push(n)}
  return out}
// loudness onsets, for claps, whispers and anything the pitch tracker can't follow
function energyOnsets(v){const F=v.rms.length;let mx=0;for(let f=0;f<F;f++)mx=Math.max(mx,v.rms[f]);const thr=Math.max(.015,mx*.18),on=[];let up=false,lo=1;
  for(let f=0;f<F;f++){const r=v.rms[f];if(!up&&r>thr&&r>lo*1.8){on.push(f*.01);up=true;lo=r}else if(up&&r<thr*.6){up=false;lo=r}else lo=Math.min(lo,r)}return on}
const KP=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88],KM=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
function corr(a,b){const n=a.length,ma=a.reduce((x,y)=>x+y)/n,mb=b.reduce((x,y)=>x+y)/n;let s=0,sa=0,sb=0;for(let i=0;i<n;i++){const da=a[i]-ma,db=b[i]-mb;s+=da*db;sa+=da*da;sb+=db*db}return s/Math.sqrt(sa*sb||1)}
function findKey(notes,tune){const h=new Array(12).fill(0);let tot=0;notes.forEach(n=>{const w=Math.min(1.2,n.dur)+.15;h[pcOf(n.m-tune)]+=w;tot+=w});
  const fpc=pcOf(notes[0].m-tune),lpc=pcOf(notes[notes.length-1].m-tune),low=pcOf(Math.min(...notes.map(n=>n.m))-tune),res=[];
  for(let r=0;r<12;r++)for(const mode of['major','minor']){const prof=mode==='major'?KP:KM,inK=(mode==='major'?[0,2,4,5,7,9,11]:[0,2,3,5,7,8,10,11]).map(x=>(x+r)%12);
    let sc=corr(h,h.map((_,i)=>prof[((i-r)%12+12)%12]));
    let out=0;for(let i=0;i<12;i++)if(!inK.includes(i))out+=h[i];sc-=3*out/tot;
    const third=(r+(mode==='major'?4:3))%12,fifth=(r+7)%12;sc+=.35*(h[r]+.6*h[third]+.6*h[fifth])/tot;
    if(low===r)sc+=.2;if(fpc===r)sc+=.05;if(lpc===fifth)sc+=.05;if(mode==='major')sc+=.1;res.push({r,mode,sc})}
  res.sort((a,b)=>b.sc-a.sc);return{root:res[0].r,mode:res[0].mode}}
// pitch marks for the voice renderer: one per glottal pulse where the voice is pitched, a fixed hop where it isn't
function pitchMarks(buf,ps){const x=buf.getChannelData(0),sr=buf.sampleRate,N=x.length,lp=new Float32Array(N),a=Math.exp(-2*Math.PI*900/sr);
  let y=0;for(let i=0;i<N;i++){y=y*a+x[i]*(1-a);lp[i]=y}
  const U=Math.round(sr*.008),M=[],P=[],V=[];let pos=0,prevV=false;
  while(pos<N){const p=ps[Math.round(pos/sr/.01)]||0;
    if(p>0){const T=sr/p;let lo,hi;if(prevV){lo=Math.round(pos+T*.75);hi=Math.round(pos+T*1.25)}else{lo=pos;hi=Math.round(pos+T)}
      let bi=-1,bv=-1e9;for(let i=lo;i<=hi&&i<N;i++)if(lp[i]>bv){bv=lp[i];bi=i}if(bi<0)break;
      M.push(bi);P.push(Math.round(T));V.push(1);pos=bi;prevV=true}
    else{pos+=prevV?Math.round(P[P.length-1]||U):U;if(pos>=N)break;M.push(pos);P.push(U);V.push(0);prevV=false}}
  return{marks:Int32Array.from(M),mper:Int32Array.from(P),mv:Uint8Array.from(V)}}

/* ---------- key and tuning ---------- */
let KEY=null; // {root, mode, pcs}
const SCALE={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10]};
function setKeyFrom(notes,tune){
  // another Sonne on the same Wi-Fi already has loops going: sing along in its key
  const k=LINK.key&&LINK.held&&!LINK.solo?LINK.key:notes.length>=2?findKey(notes,tune):{root:2,mode:'major'};
  KEY={...k,pcs:SCALE[k.mode].map(s=>(s+k.root)%12)}}
/* ---------- linked sonnes ---------- */
// Sonnes on the same Wi-Fi find each other through lil.audio (same home network = same room, no codes) and share
// one thing only: the key (Ville, 7 Nov 2026). Tempo, loop length and everything else stay each Sonne's own.
// The first Sonne to sing sets the key; any other Sonne that starts a loop while it plays sings in that key.
// Without the room service (or offline) a Sonne simply plays alone.
const LINK={solo:(()=>{try{return localStorage.getItem('sonne-solo')==='1'}catch(e){return false}})(),id:(Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).slice(0,16),key:null,held:0,peers:1,on:false,at:0,timer:0,busy:null};
const soundingKey=()=>KEY&&LOOP?{root:(((KEY.root+SEMI-(LOOP.s0||0))%12)+12)%12,mode:KEY.mode}:null;
function linkPing(){if(LINK.busy)return LINK.busy;clearTimeout(LINK.timer);
  // while this Sonne has loops it offers its key (at its current speed); the room only takes it if no other Sonne holds one
  const own=LINK.solo?null:soundingKey();

      cx.globalAlpha=.25+.75*i/n;const r=laneR(0)-band*.45;cx.beginPath();cx.moveTo(c+Math.cos(a)*(r-l/2),cy+Math.sin(a)*(r-l/2));cx.lineTo(c+Math.cos(a)*(r+l/2),cy+Math.sin(a)*(r+l/2));cx.lineWidth=Math.max(1.5,R0*.012);cx.strokeStyle='#ff6b6b';cx.stroke()}cx.globalAlpha=1}
  if(!LOOP||!ac)return;const live_=playing&&!grab;if(!live_)vT=null;const now=live_?heardNow():T0+vpos;playA+=((playing?1:.6)-playA)*ease(.25);
  for(const ly of layers){if(!ly.r)continue;const env=ly.r.env,E=env.length,dur=ly.r.buf.duration/rateOf(ly);
    for(let k=0;k<LANES;k++){const L=ly.lanes[k],Lk=laneLen(k),r=laneR(k)-band*.45;
      // the bars' height follows how much of the loop is left: as memory fades it eases slowly down to a thin line
      const ll=k?laneLvl(k):1,tgt=ll<.02?0:L.n>L.join||(L.n===L.join&&L.last!=null)?clamp(Math.sqrt((L.last??ll)/ll)):.12;
      L.vis=L.vis==null?tgt:L.vis+(tgt-L.vis)*ease(.7);const vis=L.vis;
      let lvl=(.3+.7*Math.sqrt(vis))*playA;
      // where this layer last started in this lane (or will start)
      const s=playing?(L.lastT!=null?(L.lastT<=now?L.lastT:L.lastT-Lk):L.next-Lk):T0+ly.off;
      cx.strokeStyle=LCOL[k];cx.lineWidth=Math.max(1.2,2*Math.PI*r/E*.55*dur/Lk);cx.globalAlpha=clamp(lvl,0,1);cx.beginPath();
      for(let e=0;e<E;e+=1){const u=e/E*dur,a=-Math.PI/2-2*Math.PI*(((s+u)-now)/Lk);const l=Math.max(band*.025,Math.max(.04,env[e])*band*.9*vis);
        cx.moveTo(c+Math.cos(a)*(r-l/2),cy+Math.sin(a)*(r-l/2));cx.lineTo(c+Math.cos(a)*(r+l/2),cy+Math.sin(a)*(r+l/2))}
      cx.stroke()}}
  cx.globalAlpha=1;
  // harmony: chord segments as a faint inner band turning with the loop
  if(CHORDS&&layers.length){const r=inner*1.55,ph=playing?((now-T0)%LOOP.L+LOOP.L)%LOOP.L:0;
    CHORDS.list.forEach((ch,i)=>{const a0=-Math.PI/2-2*Math.PI*(ch.t-ph)/LOOP.L,a1=a0-2*Math.PI*ch.len/LOOP.L;cx.strokeStyle=`rgb(${ink} / ${.1+.12*(i%2)})`;cx.lineWidth=band*.35;cx.beginPath();cx.arc(c,cy,r,a1+.03,a0-.03);cx.stroke()})}
  // no playhead line (Ville, 5 Nov 2026: remove the vertical stripe)
}
size();requestAnimationFrame(draw);
})();
</script>
<script>
/* lil skin colour: one soft colour whose hue drifts slowly, dark like lil.audio at night. Visual only. */
(function(){
  const root=document.documentElement,still=matchMedia('(prefers-reduced-motion: reduce)').matches,t0=Date.now();
  function paint(){const sp=+(document.getElementById('space')||{value:.45}).value;
    const hue=(250+(still?0:(Date.now()-t0)/60000*360))%360;
    root.style.setProperty('--bg',`hsl(${hue.toFixed(1)},${(36+10*sp).toFixed(1)}%,${(26-8*sp).toFixed(1)}%)`)}
  paint();setInterval(paint,250);
})();
</script>
